name: 💡 Feature Request
description: Propose an idea, improvement, or new feature.
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Bimi better? Tell us about it below!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation? A clear description of the pain point.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen and how it fits into Bimi's architecture.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
