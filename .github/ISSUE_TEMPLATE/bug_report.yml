name: 🐛 Bug Report
description: Create a report to help us fix a bug or issue.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please do not report security vulnerabilities here. Report them according to [SECURITY.md](SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Start application with '...'
        2. Navigate to '...'
        3. Trigger action '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform did this occur on?
      options:
        - Android
        - iOS
        - Web
        - Backend / Convex
        - Evolution API Webhook
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any error messages, stack traces, or console output (sanitize any personal tokens/phone numbers).
      render: shell
